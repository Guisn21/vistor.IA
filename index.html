<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005ca9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vistor.IA">
<title>Vistor.IA Generator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* Paleta do Curv.IA Generator (mesmos valores e papéis). */
  --bg:#eef1f5; --card:#f4f7fa; --input:#ffffff; --text:#14213d; --muted:#4c5b70; --faint:#7c8aa0;
  --line:#d3dce5; --line-strong:#b7c4d1;
  --primary:#005ca9; --primary-ink:#fff; --primary-hover:#00457f; --primary-text:#00457f; --primary-bg:#dce8f5;
  --warn:#a8650f; --warn-bg:#fbf0df; --danger:#b3261e; --danger-bg:#fbe9e8;
  --gold:#f0b429;
  --hdr:52px; --bar:76px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1626; --card:#101d30; --input:#152640; --text:#e4ebf2; --muted:#8fa0b8; --faint:#62748f;
    --line:#22314a; --line-strong:#324563;
    --primary:#226da8; --primary-hover:#184f80; --primary-text:#5aade8; --primary-bg:#12283f;
    --warn:#e0a744; --warn-bg:#2e2410; --danger:#e5867d; --danger-bg:#2e1715; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:var(--primary-ink);
  padding:env(safe-area-inset-top) 8px 0;min-height:calc(var(--hdr) + env(safe-area-inset-top));display:flex;align-items:center;gap:6px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:0;color:inherit;font-size:16px;padding:8px 10px;font-weight:600}
header #home{display:flex;align-items:center;padding:8px}
main{padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
h2{font-size:17px;margin:4px 0 10px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--input);color:var(--text);font:inherit}
textarea{min-height:160px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;width:100%;
  padding:14px;font:inherit;font-weight:700;background:var(--primary);color:var(--primary-ink);cursor:pointer;text-align:center}
.btn.big{padding:22px 14px;font-size:18px;margin-bottom:12px}
.btn.sec{background:var(--card);color:var(--primary-text);border:1.5px solid var(--primary)}
.btn:not(.sec):not(.danger):not(.warn):active{background:var(--primary-hover)}
.btn.danger{background:#b3261e}
.btn.warn{background:var(--warn-bg);color:var(--warn);border:1.5px solid var(--warn)}
.btn:disabled{opacity:.5}
.stack>.btn{margin-top:10px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--text);white-space:nowrap}
.badge.ok{background:var(--primary-bg);color:var(--primary-text);font-weight:700}
.badge.warn{background:var(--warn-bg);color:var(--warn);font-weight:700}
.notice{background:var(--warn-bg);color:var(--muted);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.notice b{color:var(--text)}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.brand b{font-size:20px;letter-spacing:-.01em}
.brand .sub{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#0002}
.thumb{position:relative;padding:0;border:0;background:none;cursor:pointer;border-radius:8px}
.thumb .tags{position:absolute;right:4px;top:4px;font-size:14px;text-shadow:0 1px 2px #000}
.thumb .cod{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;color:#fff;background:#0009;border-radius:4px;padding:1px 5px}
.det-img{width:100%;max-height:42dvh;object-fit:contain;border-radius:8px;background:#000;display:block;cursor:zoom-in}
.det-txt{white-space:pre-wrap;margin:0;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px}
.dialog label{margin-top:12px}

/* Tela da foto */
body.capture main{padding:0;max-width:none}
.cap{display:flex;flex-direction:column;height:calc(100dvh - var(--hdr) - env(safe-area-inset-top));background:#000}
.cap-top{color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:13px;gap:8px}
.cap-top button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:18px}
.cap-top span{flex:1;text-align:center}
.cap-top .grade-btn{font-size:14px;font-weight:700;padding:6px 10px;white-space:nowrap;background:#ffffff33}
.cap-mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.stage{position:relative}
.stage img{width:100%;height:100%;display:block;filter:brightness(.5);object-fit:fill}
.zones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.55);cursor:pointer;position:relative;
  font-size:13px;text-align:center;padding:6px;text-shadow:0 1px 3px #000}
.zone svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.zone.top{grid-column:1 / span 2}
.zone.done{background:rgba(0,92,169,.35);border-color:var(--gold)}
.zone .play{position:absolute;right:8px;top:8px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font-size:16px}
.cap-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--card)}
.cap-bar .btn{padding:12px 3px;font-size:12.5px;line-height:1.15;border-radius:10px}

/* Sobreposições */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);color:var(--text);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90dvh;overflow:auto}
.dialog h3{margin:0 0 8px;font-size:18px}
.dialog .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.full{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.full img{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-select:none}
.rec{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.rec .dot{width:22px;height:22px;border-radius:50%;background:#e53935;animation:pulse 1s infinite}
.rec .time{font-size:44px;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);
  background:#222;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;max-width:90vw;font-size:14px}
.trash{background:var(--danger-bg);border:1px solid var(--line);color:var(--danger);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.hidden{display:none!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header>
  <button id="back" class="hidden">‹ Voltar</button>
  <h1 id="title">Vistor.IA Generator</h1>
  <button id="hdrAction" class="hidden"></button>
  <button id="home" class="hidden" aria-label="Tela principal" title="Tela principal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h5v-6h3v6h5V10"/></svg></button>
</header>
<main id="view"></main>
<input id="camInput" type="file" accept="image/*" capture="environment" class="hidden">
<script src="vendor/piexif.js"></script>
<script src="vendor/jszip.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
